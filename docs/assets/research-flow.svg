<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="520" viewBox="0 0 1500 520" role="img" aria-labelledby="title desc">
  <title id="title">Deep Research Agent 深度研究执行链路</title>
  <desc id="desc">展示规划、依赖层调度、检索、质量评估、重试、多跳上下文和报告合成。</desc>
  <defs>
    <style>
      .t1{font:700 28px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#172033}
      .t2{font:400 14px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#64748b}
      .nt{font:700 15px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#1e293b;text-anchor:middle}
      .ns{font:400 12px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#64748b;text-anchor:middle}
      .el{font:500 11px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#475569;text-anchor:middle}
      .box{stroke-width:1.5;rx:14}
      .main{fill:none;stroke:#7c3aed;stroke-width:2.5;marker-end:url(#a)}
      .retry{fill:none;stroke:#dc6b32;stroke-width:2.1;stroke-dasharray:7 5;marker-end:url(#ar)}
      .memory{fill:none;stroke:#0284c7;stroke-width:2.1;marker-end:url(#ab)}
    </style>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0v6l8-3z" fill="#7c3aed"/></marker>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0v6l8-3z" fill="#dc6b32"/></marker>
    <marker id="ab" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0v6l8-3z" fill="#0284c7"/></marker>
    <filter id="s" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity=".08"/></filter>
  </defs>
  <rect width="1500" height="520" fill="#f8fafc"/>
  <text x="60" y="52" class="t1">深度研究执行链路</text>
  <text x="60" y="78" class="t2">主链路保持单向；重试和多跳上下文分别使用独立回路</text>

  <rect x="55" y="190" width="150" height="78" class="box" fill="#fff" stroke="#cbd5e1"/>
  <text x="130" y="221" class="nt">复杂问题</text><text x="130" y="244" class="ns">用户输入</text>
  <rect x="255" y="180" width="180" height="98" class="box" fill="#fff" stroke="#a78bfa"/>
  <text x="345" y="214" class="nt">Planner</text><text x="345" y="238" class="ns">最多 3 个子问题</text><text x="345" y="258" class="ns">生成 depends_on</text>
  <rect x="485" y="180" width="190" height="98" class="box" fill="#fff" stroke="#a78bfa"/>
  <text x="580" y="214" class="nt">依赖层调度</text><text x="580" y="238" class="ns">同层并发执行</text><text x="580" y="258" class="ns">并发上限 2</text>
  <rect x="725" y="165" width="220" height="128" class="box" fill="#ede9fe" stroke="#8b5cf6" filter="url(#s)"/>
  <text x="835" y="202" class="nt">检索</text><text x="835" y="227" class="ns">Vector + BM25 + RRF</text><text x="835" y="249" class="ns">可选 Rerank</text><text x="835" y="271" class="ns">本地与联网搜索并发</text>
  <rect x="995" y="180" width="190" height="98" class="box" fill="#fff" stroke="#a78bfa"/>
  <text x="1090" y="214" class="nt">质量评估</text><text x="1090" y="238" class="ns">相关性 + 完整性</text><text x="1090" y="258" class="ns">决定通过或重试</text>
  <rect x="1235" y="180" width="190" height="98" class="box" fill="#fff" stroke="#a78bfa"/>
  <text x="1330" y="214" class="nt">报告合成</text><text x="1330" y="238" class="ns">聚合来源</text><text x="1330" y="258" class="ns">生成引用报告</text>

  <path d="M205 229H255" class="main"/>
  <path d="M435 229H485" class="main"/>
  <path d="M675 229H725" class="main"/>
  <path d="M945 229H995" class="main"/>
  <path d="M1185 229H1235" class="main"/>
  <text x="1210" y="215" class="el">全部完成</text>

  <!-- retry loop above the main chain -->
  <path d="M1090 180V120H835V165" class="retry"/>
  <text x="962" y="108" class="el">未通过：查询改写 / 策略调整 / Top-K 扩展</text>

  <!-- working-memory loop below the main chain -->
  <rect x="940" y="350" width="300" height="82" class="box" fill="#e0f2fe" stroke="#38bdf8"/>
  <text x="1090" y="381" class="nt">Working Memory</text><text x="1090" y="405" class="ns">摘要 · 实体 · 事实 · 来源 ID</text>
  <path d="M1090 278V350" class="memory"/>
  <text x="1165" y="326" class="el">存在后续依赖</text>
  <path d="M940 391H835V293" class="memory"/>
  <text x="875" y="410" class="el">生成下一跳查询</text>

  <text x="60" y="485" class="t2">当前实现：最多 3 个子问题、依赖层并发上限 2、重试 Top-K 上限 20，完成后通过 SSE 返回进度并由任务接口读取最终报告。</text>
</svg>
